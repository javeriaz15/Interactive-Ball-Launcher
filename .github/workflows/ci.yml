name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend dependencies
        run: dotnet restore ./BallLauncherBackend/BallLauncherApi.sln

      - name: Build backend
        run: dotnet build ./BallLauncherBackend/BallLauncherApi.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test ./BallLauncherBackend/BallLauncherTests/BallLauncherTests.csproj --configuration Release --no-build

      - name: Build backend Docker image
        run: docker build --file ./BallLauncherBackend/Dockerfile --tag ball-launcher-api:test .

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend test dependencies
        working-directory: BallLauncherFrontend
        run: npm ci

      - name: Run Cucumber BDD acceptance tests
        working-directory: BallLauncherFrontend
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run \
            --project ../BallLauncherBackend/BallLauncherApi.csproj \
            --configuration Release \
            --no-build \
            --urls http://127.0.0.1:5293 \
            > /tmp/bdd-api.log 2>&1 &

          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          READY=false

          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:5293/swagger/index.html \
              > /dev/null; then
              READY=true
              break
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Backend API did not become ready."
            cat /tmp/bdd-api.log
            exit 1
          fi

          npm run test:bdd

      - name: Run Cypress end-to-end tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: BallLauncherFrontend
          browser: chrome
          start: dotnet run --project ../BallLauncherBackend/BallLauncherApi.csproj --configuration Release --no-build --urls http://127.0.0.1:5293, python3 -m http.server 3000
          wait-on: 'http://127.0.0.1:5293/swagger/index.html, http://127.0.0.1:3000'
          wait-on-timeout: 120
        env:
          ASPNETCORE_ENVIRONMENT: Development